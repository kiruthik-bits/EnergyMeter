<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <!-- Custom CSS (optional) -->
    <!-- Use the blueprint's static endpoint -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Page specific title -->
    <title>{% block title %}Energy Monitor{% endblock %}</title>

    <!-- Include Chart.js and adapter only if needed by the page -->
    {% block head_scripts %}{% endblock %}

</head>
<body class="d-flex flex-column min-vh-100 bg-light"> <!-- Use flexbox for sticky footer -->

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('main.index') }}">Energy Monitor</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'main.index' %}active{% endif %}" aria-current="page" href="{{ url_for('main.index') }}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'main.history' %}active{% endif %}" href="{{ url_for('main.history') }}">History</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'main.statistics' %}active{% endif %}" href="{{ url_for('main.statistics') }}">Statistics</a>
                </li>
            </ul>
        </div>
    </div>
</nav>


    <!-- Main Content Area -->
    <main class="container mt-4 mb-4 flex-grow-1"> <!-- mt-4 adds top margin, mb-4 bottom margin -->
        {% block content %}
        <!-- Page specific content goes here -->
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-dark text-white-50">
        <div class="container text-center">
            <span>Energy Monitoring System &copy; {{ now.year }}</span>
        </div>
    </footer>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

    <!-- Page specific scripts -->
    <!-- Use the blueprint's static endpoint here too -->
    {% block scripts %}
        {# Example: If dashboard.js is loaded via base.html #}
        {# <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script> #}
    {% endblock %}

</body>
</html>
