{% extends "base.html" %}

{% block title %}Dashboard - Energy Monitor{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Energy Monitoring Dashboard</h1>
        <!-- Refresh Button -->
        <button id="refresh-button" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
                <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
            </svg>
            Refresh
        </button>
        <!-- End Refresh Button -->
    </div>

    <!-- Total Power Display -->
    <div id="total-power-card" class="card text-white bg-danger mb-4 shadow-sm mx-auto" style="max-width: 400px;">
        <div class="card-header text-center fs-5">Total Current Power</div>
        <div class="card-body text-center">
            <h2 id="total-power-value" class="card-title display-5">Loading...</h2>
        </div>
    </div>

    <!-- Device Cards Area -->
    <h2 class="mb-3 text-center">Device Readings</h2>
    <div id="dashboard-cards" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <!-- Device cards will be loaded here by JavaScript -->
        <div class="col placeholder-glow" aria-hidden="true">
             <div class="card shadow-sm">
                 <div class="card-body">
                     <h5 class="card-title placeholder col-6"></h5>
                     <p class="card-text placeholder col-8"></p>
                 </div>
             </div>
         </div>
         <div class="col placeholder-glow" aria-hidden="true">
             <div class="card shadow-sm">
                 <div class="card-body">
                     <h5 class="card-title placeholder col-7"></h5>
                     <p class="card-text placeholder col-9"></p>
                 </div>
             </div>
         </div>
         <!-- Add more placeholders if desired -->
    </div>

    <!-- Error Message Area -->
    <div id="error-message" class="alert alert-danger mt-4 d-none" role="alert">
        Error loading data. Please try again later.
    </div>

</div>
{% endblock %}

{% block scripts %}
    <!-- Link to the dashboard JavaScript file -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
