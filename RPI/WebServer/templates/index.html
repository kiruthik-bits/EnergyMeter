{% extends "base.html" %}

{% block title %}Dashboard - Energy Monitor{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Energy Monitoring Dashboard</h1>
        <!-- Refresh Button -->
        <button id="refresh-button" class="btn btn-primary d-flex align-items-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-clockwise me-1" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
                <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
            </svg>
            Refresh
        </button>
        <!-- End Refresh Button -->
    </div>

    <!-- Active Devices Count Card -->
    <div id="active-devices-card" class="card text-white bg-primary mb-4 shadow-sm mx-auto" style="max-width: 400px;">
        <div class="card-header text-center fs-5">Devices Online</div>
        <div class="card-body text-center">
            <h2 id="active-devices-value" class="card-title display-5">-- / --</h2>
            <small>(Active / Total)</small>
        </div>
    </div>
    <!-- End Active Devices Count Card -->


    <!-- Device Cards Area -->
    <h2 class="mb-3 text-center">Device Status</h2>
    <div id="dashboard-cards" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <!-- Placeholder Cards -->
        <div class="col placeholder-glow" aria-hidden="true">
             <div class="card shadow-sm h-100">
                 <div class="card-body d-flex flex-column">
                     <h5 class="card-title placeholder col-6"></h5>
                     <p class="card-text placeholder col-4"></p>
                     <p class="card-text placeholder col-8"></p>
                     <p class="card-text placeholder col-5 mt-auto"></p>
                 </div>
             </div>
         </div>
         <div class="col placeholder-glow" aria-hidden="true">
             <div class="card shadow-sm h-100">
                 <div class="card-body d-flex flex-column">
                     <h5 class="card-title placeholder col-7"></h5>
                     <p class="card-text placeholder col-3"></p>
                     <p class="card-text placeholder col-7"></p>
                     <p class="card-text placeholder col-6 mt-auto"></p>
                 </div>
             </div>
         </div>
         <div class="col placeholder-glow d-none d-lg-block" aria-hidden="true">
             <div class="card shadow-sm h-100">
                 <div class="card-body d-flex flex-column">
                     <h5 class="card-title placeholder col-5"></h5>
                     <p class="card-text placeholder col-4"></p>
                     <p class="card-text placeholder col-8"></p>
                     <p class="card-text placeholder col-5 mt-auto"></p>
                 </div>
             </div>
         </div>
         <!-- End Placeholder Cards -->
    </div>

    <!-- Error Message Area -->
    <div id="error-message" class="alert alert-danger mt-4 d-none" role="alert">
        Error loading data. Please try again later.
    </div>

</div>
{% endblock %}

{% block scripts %}
    <!-- Link to the dashboard JavaScript file -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
