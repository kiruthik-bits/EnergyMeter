<!DOCTYPE html>
<html>
<head>
    <title>Energy Monitoring Dashboard</title>
    <!-- Link to your existing style.css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Energy Monitoring Dashboard</h1>
    <!-- Display Total Power -->
    <div id="total-power"></div>
    <!-- Container for individual device cards -->
    <div id="dashboard"></div>

    <script>
    function loadData() {
        fetch('/data')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                const dashboard = document.getElementById('dashboard');
                const totalDiv = document.getElementById('total-power'); // Changed ID for clarity
                dashboard.innerHTML = ''; // Clear previous cards

                // Display Total Power
                if (data.Total && data.Total.total_power !== undefined) {
                     // Changed property name to total_power
                    totalDiv.innerHTML = `<h2>Total Current Power: ${data.Total.total_power.toFixed(2)} W</h2>`;
                } else {
                    totalDiv.innerHTML = '<h2>Total Current Power: N/A</h2>';
                }

                // Display Individual Device Cards
                for (const deviceId in data) {
                    // Skip the 'Total' entry
                    if (deviceId === 'Total') continue;

                    const stats = data[deviceId];
                    const card = document.createElement('div');
                    card.className = 'device-card'; // Use class from your style.css

                    // Display latest power reading
                    let latestPower = 'N/A';
                    if (stats && stats.latest !== undefined) {
                        latestPower = `${stats.latest.toFixed(2)} W`;
                    }

                    card.innerHTML = `
                        <h2>${deviceId}</h2>
                        <p>Latest Reading: ${latestPower}</p>
                        <!-- Add other stats like average/peak here if you implement them -->
                    `;
                    dashboard.appendChild(card);
                }
                console.log("Refreshed data at", new Date().toLocaleTimeString());
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                const dashboard = document.getElementById('dashboard');
                const totalDiv = document.getElementById('total-power');
                dashboard.innerHTML = '<p style="color: red;">Error loading device data.</p>';
                totalDiv.innerHTML = '<p style="color: red;">Error loading total power.</p>';
            });
    }

    // Initial load
    loadData();
    // Refresh data every 5 seconds (5000 milliseconds)
    setInterval(loadData, 5000); // Keep the 5-second interval or adjust as needed
    </script>

</body>
</html>
